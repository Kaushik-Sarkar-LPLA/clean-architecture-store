name: Deploy to Production (Coolify)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual deployment trigger reason / Release notes'
        required: false
        default: 'Manual production deploy triggered via GitHub Actions'

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Test Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js (for Angular ClientApp)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore NuGet Dependencies
        run: dotnet restore

      - name: Compile Solution (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Install Playwright browsers (for Acceptance Tests)
        run: pwsh artifacts/bin/Web.AcceptanceTests/release/playwright.ps1 install --with-deps chromium

      - name: Run xUnit Unit & Integration Tests
        run: dotnet test --no-build --configuration Release --verbosity normal

  deploy:
    name: Trigger Coolify Production Deployment
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deployment via Coolify API on Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "🚀 Initiating Coolify Deployment for Clean Architecture Store..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
              "http://localhost:8000/api/v1/deploy?uuid=${{ secrets.COOLIFY_APP_UUID }}")

            HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
            BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")

            echo "Server Response:"
            echo "$BODY"

            if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
              echo "❌ Deployment trigger failed with HTTP status $HTTP_STATUS"
              exit 1
            fi

            echo "✅ Deployment successfully queued in Coolify!"

      - name: Verification Health Check
        run: |
          echo "Waiting 45 seconds for Docker container build and rollout on priyanka..."
          sleep 45

          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://store.pixilens.online/scalar/v1 || echo "000")
            echo "Attempt $i: https://store.pixilens.online/scalar/v1 returned HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "🎉 Production deployment verified healthy! API Docs available at https://store.pixilens.online/scalar/v1"
              exit 0
            fi
            sleep 10
          done

          echo "⚠️ App is still compiling or building; verify status at https://store.pixilens.online"
